# Gas meter monitor: Elster/Honeywell AC-250 (SoCalGas), read with a
# magnetometer on the back diaphragm cover.
#
# Hardware: Seeed XIAO ESP32-C6 + GY-273 magnetometer (QMC5883P, I2C 0x2C)
# Firmware: tronikos/esphome-magnetometer-water-gas-meter (gas package)
#
# Symbolic name to GPIO pin map
#  D0 =  GPIO0
#  D1 =  GPIO1
#  D2 =  GPIO2
#  D3 = GPIO21   <- sensor SCL
#  D4 = GPIO22   <- sensor SDA
#  D5 = GPIO23
#  D6 = GPIO16
#  D7 = GPIO17
#  D8 = GPIO19
#  D9 = GPIO20
# D10 = GPIO18

substitutions:
  # ft³ is the finest unit the package offers for gas; HA can display CCF/therms.
  volume_unit: 'ft³'
  i2c_sda: GPIO22  # D4
  i2c_scl: GPIO21  # D3
  # Set both to 'false' temporarily while calibrating / checking noise,
  # then back to 'true' (they slow the loop down and reduce accuracy).
  hide_magnetic_field_strength_sensors: 'true'
  hide_half_rotations_total_sensor: 'true'
  # Diagnostics and tuning entities (Z log, live flow internals, thresholds,
  # magnet span, axis, ...): hidden from Home Assistant unless set to 'false'.
  # They keep working on the device either way.
  hide_diagnostics: 'true'
  # The package blinks an LED as the meter turns; use the XIAO's onboard
  # user LED (GPIO15) instead of the package default GPIO2 (= D2).
  gpio_led: GPIO15

packages:
  meter:
    url: https://github.com/tronikos/esphome-magnetometer-water-gas-meter
    ref: main
    # The GY-273 boards we have carry a QMC5883P (marked "HP 5883", I2C 0x2C).
    # If the I2C scan in the log shows 0x0D instead, it's a QMC5883L:
    # remove qmc5883p.yaml from this list.
    files: [esphome-gas-meter.yaml, qmc5883p.yaml]
    refresh: 1d

esphome:
  name: gas-meter
  friendly_name: Gas Meter
  # Live flow from the magnetometer waveform (see gas_live_flow.h)
  includes:
    - gas_live_flow.h
  # No on_boot here on purpose: the meter package uses esphome.on_boot to
  # speed up the main loop, and defining it here would replace that.

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

web_server:

api:
  encryption:
    key: !secret home_assistant_key

ota:
  - platform: esphome

# Enable logging
logger:
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  level: info

captive_portal:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains powered: keep the radio awake and at full power, the meter is at
  # the edge of Wi-Fi coverage.
  power_save_mode: none
  output_power: 20dB

  ap:
    ssid: "gas-meter"

button:
  - platform: restart
    name: "Restart Device"

  # Forget the learned waveform and go back to the recorded seed shape.
  - platform: template
    name: "Reset Live Flow Shape"
    entity_category: config
    internal: ${hide_diagnostics}
    icon: mdi:restore
    on_press:
      - lambda: live_flow::tracker().reset();

text_sensor:
  - platform: uptime
    name: Uptime
    internal: ${hide_diagnostics}
    update_interval: 1d
    format:
      separator: " "
      days: "D"

  - platform: template
    name: "Live Flow Learning"
    entity_category: diagnostic
    icon: mdi:school
    update_interval: 60s
    # "Calibrated" once it has learned the waveform from a full cycle since the
    # last Calibrate axis / Reset Live Flow Shape; "Learning" until then. (It
    # keeps refining in the background either way.)
    lambda: |-
      static int calibrated = -1;
      int last = live_flow::tracker().last_learn();
      uint32_t n = live_flow::tracker().shape_updates();
      if (calibrated < 0) calibrated = n > 0;    // after a restart: the saved shape
      if (last == 8 || n == 0) calibrated = 0;   // recalibrated or reset
      else if (last == 1 || last == 5) calibrated = 1;
      return {calibrated ? "Calibrated" : "Learning"};

binary_sensor:
  - platform: status
    name: "Connection"

sensor:
  # The meter package's count-based Flow is replaced by "Flow (live)".
  - id: !remove sensor_flow

  # Magnetometer range: Z swings ~31-75 uT here, so +-8 gauss (800 uT)
  # leaves lots of margin and is finer than the driver's default +-30 gauss.
  # Recalibrate (Calibrate axis) after changing it.
  - id: !extend qmc5883l_id
    range: 8G

  # Reports the WiFi signal strength/RSSI in dB
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  # Z-axis log for checking the waveform and count timing in Home Assistant.
  # Averages the raw 200 Hz readings to 2 points per second, so the main
  # Exactly what the live flow tracker is fed (2 Hz), so the tracker can be
  # replayed offline from Home Assistant's history. Adds ~170k rows a day to
  # the HA database, so it only publishes while the "Z Log" switch is on.
  - platform: copy
    source_id: live_flow_input
    name: "Magnetic Field Z (log)"
    id: magnetic_field_z_log
    entity_category: "diagnostic"
    unit_of_measurement: "µT"
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - lambda: |-
          if (!id(z_log_enabled).state) return {};
          return x;

  # Live flow converted to heat input; set Heat content from your bill (see below).
  - platform: copy
    source_id: flow_live
    name: "Heat Input"
    id: heat_input
    unit_of_measurement: "BTU/h"
    device_class: power
    state_class: measurement
    icon: mdi:fire
    accuracy_decimals: 0
    filters:
      - lambda: return x * 60.0f * id(heat_content).state;

  # Live flow: tracks the meter's position within each cycle from the Z
  # waveform, so it responds in seconds instead of waiting for counts.
  # Total is unaffected. It adapts to drift and re-learns the waveform by
  # itself (see gas_live_flow.h). Fed at 2 Hz (each value averages ~100 raw
  # readings); 10 Hz made the real pilot reading scatter more.
  - platform: copy
    source_id: axis_value
    id: live_flow_input
    internal: true
    filters:
      - throttle_average: 500ms
    on_value:
      then:
        - lambda: |-
            // Follow the meter package's "Calibrate axis": when a calibration
            // finishes, hand the new field range (and whether the axis
            // changed) to the live flow tracker so it starts afresh.
            static bool was_cal = false;
            static int old_axis = -1;
            static float old_span = 0, old_amp = 0;
            // axis as 0/1/2 (x/y/z), compared the same way the meter package does
            auto axis_idx = []() -> int {
              if (id(axis).current_option() == "x") return 0;
              if (id(axis).current_option() == "y") return 1;
              if (id(axis).current_option() == "z") return 2;
              return -1;
            };
            bool cal = id(calibrating);
            if (cal && !was_cal) {
              old_axis = axis_idx();
              old_span = id(magnet_span).state;
              old_amp = live_flow::tracker().amplitude();
            }
            if (!cal && was_cal) {
              int ax = axis_idx();
              float lo = NAN, hi = NAN;
              if (ax == 0) { lo = id(calibrating_axis_x_min); hi = id(calibrating_axis_x_max); }
              if (ax == 1) { lo = id(calibrating_axis_y_min); hi = id(calibrating_axis_y_max); }
              if (ax == 2) { lo = id(calibrating_axis_z_min); hi = id(calibrating_axis_z_max); }
              if (std::isfinite(lo) && std::isfinite(hi) && hi - lo >= id(calibration_minimal_axis_range).state) {
                bool new_axis = ax != old_axis;
                // The calibration sees raw extremes, which noise widens; scale by
                // how the tracker's own amplitude related to the last calibration.
                float ratio = (!new_axis && old_span > 0 && old_amp > 0) ? 2 * old_amp / old_span : 1.0f;
                if (ratio < 0.7f) ratio = 0.7f;
                if (ratio > 1.1f) ratio = 1.1f;
                live_flow::tracker().recalibrate(lo, hi, new_axis, ratio);
                ESP_LOGI("live_flow", "Recalibrated: axis %c%s, range %.1f..%.1f uT", "xyz"[ax], new_axis ? " (new)" : "", lo, hi);
              }
            }
            was_cal = cal;
            live_flow::tracker().update(esp_timer_get_time() / 1e6, x);

  - platform: template
    name: "Flow (live)"
    id: flow_live
    unit_of_measurement: "ft³/min"
    device_class: volume_flow_rate
    state_class: measurement
    icon: mdi:speedometer
    accuracy_decimals: 4
    update_interval: 5s
    # Publish right away on any real change, otherwise once a minute, so a
    # steady pilot does not write a row to the HA database every 5 s.
    filters:
      - or:
          - delta: 0.0003
          - throttle: 60s
    lambda: |-
      if (!live_flow::tracker().ready()) return NAN;
      return live_flow::tracker().cycles_per_s() * id(volume_per_half_rotation).state * 60.0f;

  # What the live flow tracker has learned: offset/amplitude follow drift, the
  # waveform is re-learned from any steady flow, the noise level is measured
  # (and sets the turn hysteresis). Saved across restarts.
  - platform: template
    name: "Live Flow Offset"
    entity_category: diagnostic
    internal: ${hide_diagnostics}
    unit_of_measurement: µT
    accuracy_decimals: 2
    update_interval: 60s
    lambda: return live_flow::tracker().offset();
  - platform: template
    name: "Live Flow Amplitude"
    entity_category: diagnostic
    internal: ${hide_diagnostics}
    unit_of_measurement: µT
    accuracy_decimals: 2
    update_interval: 60s
    lambda: return live_flow::tracker().amplitude();
  - platform: template
    name: "Live Flow Noise"
    entity_category: diagnostic
    internal: ${hide_diagnostics}
    unit_of_measurement: µT
    accuracy_decimals: 3
    update_interval: 60s
    lambda: return live_flow::tracker().noise();
  - platform: template
    name: "Live Flow Shape Updates"
    entity_category: diagnostic
    internal: ${hide_diagnostics}
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) live_flow::tracker().shape_updates();
  # Longest single live-flow update in the last minute, as a CPU check
  # (ESPHome itself warns when anything blocks the loop for over 30 ms).
  - platform: template
    name: "Live Flow Update Time"
    entity_category: diagnostic
    internal: ${hide_diagnostics}
    unit_of_measurement: ms
    accuracy_decimals: 2
    update_interval: 60s
    lambda: return live_flow::tracker().take_max_update_ms();

# Energy per cubic foot of gas, used by Heat Input. SoCalGas prints a "billing
# factor" (therms per CCF) on each bill: Heat content = factor x 1000, e.g.
# 1.032 -> 1032 BTU/ft3. It drifts a percent or two month to month.
number:
  - platform: template
    id: heat_content
    name: "Heat Content"
    unit_of_measurement: "BTU/ft³"
    entity_category: config
    mode: box
    min_value: 900
    max_value: 1200
    step: 1
    initial_value: 1035  # SoCalGas BTU factor 1.035 (Sep 2026 bill)
    restore_value: true
    optimistic: true

  # Set automatically by Calibrate axis (or fixed tuning): no need to show them.
  - id: !extend magnet_span
    internal: ${hide_diagnostics}
  - id: !extend threshold_lower
    internal: ${hide_diagnostics}
  - id: !extend threshold_upper
    internal: ${hide_diagnostics}
  - id: !extend calibration_seconds
    internal: ${hide_diagnostics}
  - id: !extend calibration_minimal_axis_range
    internal: ${hide_diagnostics}

# The axis is picked by Calibrate axis (Z here); the detection algorithm stays
# on Adaptive.
select:
  - id: !extend axis
    internal: ${hide_diagnostics}
  - id: !extend detection_algorithm
    internal: ${hide_diagnostics}

# Antenna RF switch (FM8625H) using ESPHome 2025.12+ board aliases.
# Both antennas go through this switch, so it must be enabled even for the
# built-in antenna. GPIO switches (not on_boot) so we don't override the
# meter package's on_boot.
#   RF_SWITCH_EN  (GPIO3):  LOW = RF switch powered
#   RF_ANT_SELECT (GPIO14): LOW = built-in ceramic antenna, HIGH = external U.FL
switch:
  # Publish "Magnetic Field Z (log)" (the tracker's 2 Hz input) to Home
  # Assistant. Survives restarts; no flash needed to turn it on or off.
  - platform: template
    name: "Z Log"
    id: z_log_enabled
    entity_category: config
    icon: mdi:chart-line
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: gpio
    id: rf_switch_enable
    pin: RF_SWITCH_EN
    restore_mode: ALWAYS_OFF   # LOW -> RF switch ON
    internal: true
  - platform: gpio
    id: rf_antenna_select
    pin: RF_ANT_SELECT
    restore_mode: ALWAYS_ON    # HIGH -> external U.FL antenna (ALWAYS_OFF = built-in)
    internal: true
